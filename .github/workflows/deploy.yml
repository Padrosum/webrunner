name: Deploy WebRunner

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Alpine latest-stable runtime is refreshed daily without a code push.
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site and fetch runtime assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/assets
          mkdir -p dist/third-party .github/docker/alpine/holyp-src
          cp index.html styles.css app.js dist/
          # Make each Pages deploy load the matching frontend bundle instead
          # of keeping an older app.js/styles.css in the browser cache.
          sed -i "s|href=\"./styles.css\"|href=\"./styles.css?v=${GITHUB_SHA}\"|" dist/index.html
          sed -i "s|src=\"./app.js\"|src=\"./app.js?v=${GITHUB_SHA}\"|" dist/index.html
          sed -i "s|__BUILD_ID__|${GITHUB_SHA}|g" dist/app.js

          V86_BASE="https://copy.sh/v86"
          # Build a bootable i386 Alpine rootfs for v86 instead of using the
          # installer-only netboot initramfs.
          git clone --depth 1 https://github.com/copy/v86.git "$RUNNER_TEMP/v86"
          git clone --depth 1 https://github.com/Padrosum/holyp.git "$RUNNER_TEMP/holyp"
          HOLYP_COMMIT=$(git -C "$RUNNER_TEMP/holyp" rev-parse HEAD)
          git -C "$RUNNER_TEMP/holyp" archive --format=tar HEAD \
            | tar -x -C .github/docker/alpine/holyp-src
          git -C "$RUNNER_TEMP/holyp" archive \
            --format=tar.gz --output="$GITHUB_WORKSPACE/dist/third-party/holyp-source.tar.gz" HEAD
          printf '%s\n' "$HOLYP_COMMIT" > dist/third-party/holyp-commit.txt
          cp tools/THIRD_PARTY_NOTICES.md dist/third-party/README.md
          # Rebuild the runtime image from the checked-out sources so the
          # published Alpine environment always matches this repository.
          docker build --pull --no-cache --platform linux/386 \
            --file .github/docker/alpine/Dockerfile \
            --tag webrunner-alpine:latest .
          docker run --rm --platform linux/386 webrunner-alpine:latest \
            /bin/sh -c 'test "$(/usr/bin/webrunner-tty --version)" = "WebRunner tty helper 2" && test -x /usr/bin/webrunner-net && /usr/bin/holyp -V >/dev/null && /usr/bin/hc-about >/dev/null && /usr/bin/hc-net-info >/dev/null && ! command -v tor'
          alpine_container=$(docker create --platform linux/386 webrunner-alpine:latest)
          docker export "$alpine_container" --output "$RUNNER_TEMP/alpine-rootfs.tar"
          docker rm "$alpine_container"

          tar -tf "$RUNNER_TEMP/alpine-rootfs.tar" | grep -x 'usr/bin/webrunner-tty' >/dev/null
          tar -tf "$RUNNER_TEMP/alpine-rootfs.tar" | grep -x 'usr/bin/webrunner-net' >/dev/null

          mkdir -p dist/assets/alpine-rootfs-flat
          python3 "$RUNNER_TEMP/v86/tools/fs2json.py" \
            --exclude /.dockerenv \
            --exclude /boot \
            --out dist/assets/alpine-fs.json \
            "$RUNNER_TEMP/alpine-rootfs.tar"
          python3 "$RUNNER_TEMP/v86/tools/copy-to-sha256.py" \
            "$RUNNER_TEMP/alpine-rootfs.tar" \
            dist/assets/alpine-rootfs-flat

          tar -xOf "$RUNNER_TEMP/alpine-rootfs.tar" boot/vmlinuz-virt > dist/assets/vmlinuz-virt
          tar -xOf "$RUNNER_TEMP/alpine-rootfs.tar" boot/initramfs-virt > dist/assets/initramfs-virt
          ALPINE_VERSION=$(tar -xOf "$RUNNER_TEMP/alpine-rootfs.tar" etc/alpine-release | tr -d '\n')
          HOLYP_VERSION=$(tar -xOf "$RUNNER_TEMP/alpine-rootfs.tar" etc/webrunner-versions \
            | sed -n 's/^holyp=//p' | tr -d '\n')
          printf '{"alpine_version":"%s","holyp_version":"%s","holyp_commit":"%s"}\n' \
            "$ALPINE_VERSION" "$HOLYP_VERSION" "$HOLYP_COMMIT" > dist/runtime.json

          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            "$V86_BASE/build/libv86.js" -o dist/assets/libv86.js
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            "$V86_BASE/build/v86.wasm" -o dist/assets/v86.wasm
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            "$V86_BASE/bios/seabios.bin" -o dist/assets/seabios.bin
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            "$V86_BASE/bios/vgabios.bin" -o dist/assets/vgabios.bin

          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
